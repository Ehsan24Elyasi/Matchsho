# Direct edge. Never append caller-supplied forwarded headers.
resolver 127.0.0.11 valid=10s ipv6=off;
upstream matchsho_api {
    zone matchsho_api 64k;
    server matchsho-backend:8000 resolve;
}
log_format pilot_json escape=json '{"time":"$time_iso8601","request_id":"$request_id","method":"$request_method","path":"$uri","status":$status,"seconds":$request_time,"upstream_seconds":"$upstream_response_time"}';
map $uri $asset_cache {
    default "no-cache";
    "~^/assets/[a-f0-9]{8,}/" "public, max-age=31536000, immutable";
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;
    access_log /dev/stdout pilot_json;
    error_log /dev/stderr warn;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Request-ID $request_id always;
    add_header Cache-Control $asset_cache always;
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /api { return 308 /api/; }
    location /api/ {
        proxy_pass http://matchsho_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_hide_header X-Request-ID;
    }
    location ~* \.(?:html|css|js|json|woff2?|svg|png|jpe?g|webp|ico)$ {
        try_files $uri =404;
    }
    location ~ /\. { deny all; }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
