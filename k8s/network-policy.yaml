# Requires a NetworkPolicy-capable CNI. Proxy CIDR trust is safe only with this enforced boundary.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: matchsho-backend-ingress}
spec:
  podSelector:
    matchLabels: {app: matchsho, component: backend}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: matchsho, component: frontend}
      ports: [{protocol: TCP, port: 8000}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: matchsho-backend}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: matchsho, component: backend}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: matchsho-frontend}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: matchsho, component: frontend}
